<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Sinh Viên</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!-- Khung chứa bảng -->
    <div class="table-container">
        <span class="badge">BẢNG ĐIỂM</span>

        <table class="student-table">
            <thead>
                <tr>
                    <th class="col-center">STT</th>
                    <th>Họ và Tên</th>
                    <th>Môn Học</th>
                    <th class="col-center">Điểm</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-center">1</td>
                    <td>Nguyễn Thu Anh</td>
                    <td>Xây dựng ứng dụng Web</td>
                    <td class="col-center">8.5</td>
                </tr>
                <tr>
                    <td class="col-center">2</td>
                    <td>Trần Hải Anh</td>
                    <td>Xây dựng ứng dụng Web</td>
                    <td class="col-center">9.0</td>
                </tr>
                <tr>
                    <td class="col-center">3</td>
                    <td>Lê Hưởng Dương</td>
                    <td>Xây dựng ứng dụng Web</td>
                    <td class="col-center">7.5</td>
                </tr>
                <tr>
                    <td class="col-center">4</td>
                    <td>Phạm Viết Minh</td>
                    <td>Xây dựng ứng dụng Web</td>
                    <td class="col-center">8.0</td>
                </tr>
            </tbody>
            <tfoot>
                <tr class="avg-row">
                    <td colspan="3">Điểm trung bình</td>
                    <td class="col-center">8.25</td>
                </tr>
            </tfoot>
        </table>
    </div>

</body>
</html>
