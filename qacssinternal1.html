<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1 - Internal CSS</title>
    
    <style>
        body {
            background-color: #f4f7f6; /* Mã HEX */
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 0.5px;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: 1.5px;
            color: #1a2a3a;
        }

        .header-title {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            color: white; /* Tên màu */
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        p {
            font-style: normal;
            color: rgb(51, 51, 51); /* Mã RGB */
        }

        .profile {
            width: 450px;
            margin: 0 auto;
            padding: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            background-color: #ffffff;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1); /* Mã RGBA */
            text-align: center;
        }

        .profile p {
            font-size: 15px;
            margin-bottom: 10px;
        }

        #avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #4ca1af;
            object-fit: cover;
            margin-bottom: 15px;
        }

        a {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #fb45d0;
            text-decoration: underline;
        }

        /* 8. Danh sách sở thích & hover */
        .hobby-list {
            list-style-type: square;
            padding-left: 25px;
            text-align: left;
        }

        .hobby-list li {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .hobby-list li:hover {
            background-color: #ea8cc7c6;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="header-title">
        <h1>TRANG THÔNG TIN CÁ NHÂN (INTERNAL CSS)</h1>
    </header>

    <main>
        <section class="profile">
            <img id="avatar" src="https://www.technocrazed.com/wp-content/uploads/2015/12/HD-purple-wallpaper-image-to-use-as-background-1.jpg" alt="Ảnh đại diện">
            <h2>Lê Quỳnh ANh</h2>

            <p><strong>Mã sinh viên:</strong> 252060104746</p>
            <p><strong>Ngành học:</strong> THương mại điện tử</p>
            <p>
                Tớ là sinh viên lớp TH3 Xây dựng ứng dụng web 
                Tìm facebook tớ tại đây nhé!!
                <a href="https://facebook.com" target="_blank">đây</a> 
</p>

            <h2>Sở thích</h2>
            <ul class="hobby-list">
                <li>Đi concert</li>
                <li>Nghe nhạc</li>
                <li>Chơi thể thao </li>
                <li>Làm bánh</li>
            </ul>
        </section>
    </main>

</body>
</html>
