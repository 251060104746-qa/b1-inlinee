<!DOCTYPE html>
<html lang="vi">

<body style="background-color: #f4f7f6; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; letter-spacing: 0.5px; margin: 0; padding: 20px;">

            <p style="font-style: normal; color: rgb(51, 51, 51); font-size: 15px; margin-bottom: 10px;"><strong>Ngành học:</strong> Thương mại điện tử</p>
            <p style="font-style: normal; color: rgb(51, 51, 51); font-size: 15px; margin-bottom: 10px;">

            <ul style="list-style-type: square; padding-left: 25px; text-align: left;">
